spring.application.name=gardenassistance
server.port=9090

#DB
spring.datasource.url=jdbc:postgresql://localhost:5434/gardenassistantdb
spring.datasource.username=gardenAdmin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.docker.compose.enabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# GraphQL
spring.graphql.graphiql.enabled=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.springframework.cache=TRACE

#resilience4j
resilience4j.circuitbreaker.instances.weatherService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.weatherService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.weatherService.wait-duration-in-open-state=10s

resilience4j.retry.instances.weatherService.max-attempts=3
resilience4j.retry.instances.weatherService.wait-duration=2s

resilience4j.timelimiter.instances.weatherService.timeout-duration=5s